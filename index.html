<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Hearth &amp; Slab — Cozinhas Externas na Flórida</title>
<meta name="description" content="Cozinhas externas em tijolo, concreto e inox 316, projetadas em 3D e construídas em três dias na Flórida. Garantia vitalícia e financiamento 0%.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter+Tight:wght@400;500&display=swap" rel="stylesheet">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%230d0c0b'/%3E%3Ctext x='16' y='22' text-anchor='middle' font-family='Helvetica,Arial' font-size='18' fill='%23f2f0ec'%3E%E2%9C%B5%3C/text%3E%3C/svg%3E">
<style>
:root{
  --fg:#0d0c0b;
  --fg-soft:rgba(13,12,11,.64);
  --fg-faint:rgba(13,12,11,.42);
  --shade:#f2f0ec;
  --shade-2:#e9e5de;
  --card:#f7f5f1;
  --ink:#0d0c0b;
  --ink-2:#161412;
  --paper-on-ink:#f2f0ec;
  --paper-soft:rgba(242,240,236,.62);
  --paper-faint:rgba(242,240,236,.38);
  --rule:rgba(13,12,11,.16);
  --rule-soft:rgba(13,12,11,.08);
  --rule-ink:rgba(242,240,236,.16);
  --rule-ink-soft:rgba(242,240,236,.08);
  --ember:#e8632c;
  --ember-2:#ffb15c;
  --ease:cubic-bezier(.22,.61,.36,1);
  --pill-bg:#0a0908;
  --pill-fg:#ffffff;
}
*{box-sizing:border-box;margin:0;padding:0}
html{-webkit-text-size-adjust:100%;scroll-behavior:smooth}
body{
  background:var(--shade); color:var(--fg);
  font-family:'Inter Tight','Helvetica Neue',Helvetica,Arial,sans-serif; font-weight:400;
  -webkit-font-smoothing:antialiased; -moz-osx-font-smoothing:grayscale; overflow-x:hidden;
}
a{color:inherit}
img,canvas,svg{display:block}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
::selection{background:var(--ember);color:#fff}

/* ============ sticky 3D hero ============ */
.hero{position:relative;height:640vh;min-height:3600px;z-index:1}
.hero-stick{position:sticky;top:0;height:100vh;height:100svh;overflow:hidden}
.stage{position:absolute;inset:0;z-index:0;overflow:hidden;background:var(--shade)}
.stage canvas{position:absolute;inset:0;width:100%;height:100%}
.veil{
  position:absolute;inset:0;pointer-events:none;
  background:
    linear-gradient(to bottom, rgba(242,240,236,.62) 0%, rgba(242,240,236,.06) 22%, rgba(242,240,236,.06) 78%, rgba(242,240,236,.66) 100%),
    radial-gradient(100% 80% at 50% 48%, rgba(242,240,236,0) 0%, rgba(242,240,236,.22) 100%),
    radial-gradient(60% 40% at 50% 100%, rgba(232,99,44,.10) 0%, rgba(232,99,44,0) 100%);
}
.grain{
  position:absolute;inset:-50%;opacity:.13;mix-blend-mode:multiply;pointer-events:none;
  background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='140' height='140'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.85' numOctaves='3'/></filter><rect width='140' height='140' filter='url(%23n)' opacity='.5'/></svg>");
}
.tags{position:absolute;inset:0;z-index:15;pointer-events:none;overflow:hidden}
.tag{position:absolute;left:0;top:0;opacity:0;will-change:transform,opacity;display:flex;align-items:center;gap:10px;white-space:nowrap;font-size:12.5px;letter-spacing:.02em;color:var(--fg);transform:translate3d(-9999px,-9999px,0)}
.tag .dot{width:7px;height:7px;border-radius:50%;background:var(--ember);flex:none;box-shadow:0 0 0 3px rgba(242,240,236,.9);display:flex;align-items:center;justify-content:center}
.tag .dot i{display:none;font-style:normal;font-size:10px;font-weight:500;color:#fff;letter-spacing:0}
.tag .line{width:34px;height:1px;background:var(--fg);opacity:.55;flex:none}
.tag .txt{display:flex;flex-direction:column;gap:2px;line-height:1.2;background:rgba(242,240,236,.72);padding:6px 9px;border-radius:4px;backdrop-filter:blur(4px)}
.tag b{font-weight:500;font-size:12.5px;letter-spacing:-.005em}
.tag b span{color:var(--ember);font-weight:500;margin-right:8px}
.tag em{font-style:normal;color:var(--fg-soft);font-size:11px;letter-spacing:.03em}
.tag.flip{flex-direction:row-reverse}
.tag.flip .txt{text-align:right}
.legend{display:none;list-style:none;margin-top:14px;gap:6px 14px;flex-wrap:wrap;justify-content:center;font-size:11.5px;letter-spacing:.02em;color:var(--fg-soft)}
.legend b{font-weight:500;color:var(--ember);margin-right:4px}

.panels{position:absolute;inset:0;z-index:20;pointer-events:none}
.panel{
  position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;
  padding:max(104px, calc(env(safe-area-inset-top, 0px) + 88px)) clamp(20px, 5vw, 60px) max(96px, calc(env(safe-area-inset-bottom, 0px) + 80px));
  opacity:0;will-change:opacity,transform;
}
.panel--low{justify-content:flex-end}
.panel--low h1{font-size:clamp(26px, 3.6vw, 54px);max-width:18ch}
.panel--low .sub{margin-top:clamp(12px,1.4vw,18px);max-width:40ch}
.eyebrow{display:flex;align-items:center;justify-content:center;flex-wrap:wrap;gap:6px 12px;font-size:12.5px;letter-spacing:.045em;text-transform:uppercase;color:var(--fg-soft);margin-bottom:clamp(16px,2vw,22px);max-width:min(46ch,100%);text-align:center}
.eyebrow::before{content:"";width:6px;height:6px;border-radius:50%;background:var(--ember)}
h1{font-weight:400;font-size:clamp(34px, 7.1vw, 104px);line-height:.98;letter-spacing:-.036em;max-width:15ch;text-wrap:balance}
.sub{margin-top:clamp(18px,2.2vw,28px);font-size:clamp(15px,1.28vw,19px);line-height:1.5;letter-spacing:-.008em;color:var(--fg-soft);max-width:min(46ch,100%);text-wrap:pretty}
.cta{margin-top:clamp(28px,3.4vw,44px);pointer-events:auto;width:100%;display:flex;justify-content:center;gap:12px;flex-wrap:wrap}
.cta .pill{height:48px;padding:0 27px;font-size:15px;max-width:min(100%,320px)}
.pill--ghost{background:transparent!important;color:var(--fg)!important;-webkit-text-fill-color:var(--fg)!important;border-color:var(--rule)!important}
.pill--ember{background:var(--ember)!important;border-color:transparent!important}
.trust{margin-top:18px;display:flex;align-items:center;justify-content:center;gap:10px;flex-wrap:wrap;font-size:12.5px;letter-spacing:.02em;color:var(--fg-soft)}
.trust .st{color:var(--ember);letter-spacing:1px}
.trust i{width:3px;height:3px;border-radius:50%;background:var(--fg-faint);font-style:normal}
.hint{margin-top:22px;font-size:11.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--fg-faint);display:flex;align-items:center;gap:8px}
.hint i{display:block;width:1px;height:26px;background:var(--fg-faint);animation:drop 1.8s var(--ease) infinite;transform-origin:0 0}
@keyframes drop{0%{transform:scaleY(0)}50%{transform:scaleY(1)}100%{transform:scaleY(0);transform-origin:0 100%}}
.stats{margin-top:clamp(22px,2.6vw,34px);display:flex;gap:clamp(18px,3vw,44px);flex-wrap:wrap;justify-content:center;pointer-events:none}
.stats div{display:flex;flex-direction:column;gap:3px;font-size:12px;letter-spacing:.04em;text-transform:uppercase;color:var(--fg-faint)}
.stats div b{font-weight:400;font-size:clamp(20px,2vw,28px);letter-spacing:-.03em;color:var(--fg);text-transform:none}
.hero-foot{
  position:absolute;bottom:0;left:0;right:0;z-index:22;display:flex;justify-content:center;
  padding:14px clamp(16px, 4vw, 24px) max(16px, calc(env(safe-area-inset-bottom, 0px) + 12px));
  font-size:12px;line-height:1.45;letter-spacing:.02em;color:var(--fg-faint);text-align:center;pointer-events:none;
  background:linear-gradient(to top, rgba(242,240,236,.92) 0%, rgba(242,240,236,.72) 72%, rgba(242,240,236,0) 100%);
}

/* ============ chrome ============ */
.chrome{
  position:fixed;left:0;right:0;top:0;z-index:40;display:flex;align-items:center;justify-content:space-between;gap:12px;
  padding:max(14px, calc(env(safe-area-inset-top, 0px) + 12px)) clamp(16px, 3.4vw, 44px) 14px;
  background:linear-gradient(to bottom, rgba(242,240,236,.94) 0%, rgba(242,240,236,.78) 72%, rgba(242,240,236,0) 100%);
  transition:background .4s var(--ease), color .4s var(--ease);
}
.chrome.solid{background:rgba(242,240,236,.9);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);border-bottom:1px solid var(--rule-soft)}
.chrome.dark{background:rgba(13,12,11,.82);color:var(--paper-on-ink);border-bottom-color:var(--rule-ink-soft)}
.chrome.dark .nav a:not(.pill):not(.lang){color:var(--paper-on-ink)}
.chrome.dark .lang{border-color:var(--rule-ink)}
.chrome.dark .lang span{color:var(--paper-faint)}
.chrome.dark .lang span.on{background:var(--paper-on-ink);color:var(--ink)}
.chrome.dark .nav .pill{background:var(--paper-on-ink);color:var(--ink);-webkit-text-fill-color:var(--ink)}
.mark{display:flex;align-items:center;gap:9px;font-size:15px;letter-spacing:-.012em;color:inherit;min-width:0;flex-shrink:1;text-decoration:none}
.mark-star{color:var(--ember)}
.nav{display:flex;align-items:center;gap:clamp(14px, 2.4vw, 32px);flex-shrink:0}
.nav a:not(.pill):not(.lang){color:var(--fg);text-decoration:none;font-size:14.5px;letter-spacing:-.008em;opacity:.88;transition:opacity .3s var(--ease);cursor:pointer}
.nav a:not(.pill):hover{opacity:1}
.lang{display:inline-flex;gap:0;border:1px solid var(--rule);border-radius:999px;overflow:hidden;font-size:12px;letter-spacing:.04em;cursor:pointer;user-select:none;text-decoration:none}
.lang span{padding:7px 10px;color:var(--fg-faint);transition:background .3s,color .3s}
.lang span.on{background:var(--fg);color:#fff}
.pill{
  display:inline-flex;align-items:center;justify-content:center;height:40px;padding:0 21px;border-radius:999px;
  background:var(--pill-bg);color:var(--pill-fg);font-size:14.5px;font-weight:500;letter-spacing:-.008em;text-decoration:none;
  white-space:nowrap;opacity:1;border:1px solid rgba(10,9,8,.12);box-shadow:0 1px 0 rgba(255,255,255,.10) inset;
  -webkit-text-fill-color:var(--pill-fg);cursor:pointer;font-family:inherit;
  transition:transform .4s var(--ease), background .3s var(--ease), color .3s var(--ease);
}
.nav .pill{color:#fff;-webkit-text-fill-color:#fff}
.pill:hover,.pill:focus-visible{transform:translateY(-2px);background:#000;color:#fff;-webkit-text-fill-color:#fff}
.pill--ember:hover{background:#d4541f!important}
.pill:focus-visible{outline:2px solid var(--ember);outline-offset:2px}
.meter{position:fixed;top:0;left:0;z-index:50;height:2px;width:100%;transform:scaleX(0);transform-origin:0 50%;background:var(--ember);opacity:.9}

/* mobile sticky action bar */
.mbar{position:fixed;left:12px;right:12px;bottom:max(12px, env(safe-area-inset-bottom, 0px));z-index:45;display:none;gap:8px;transform:translateY(120%);transition:transform .5s var(--ease)}
.mbar.on{transform:none}
.mbar a{flex:1;height:46px;font-size:14px}
.mbar .pill--ghost{background:rgba(242,240,236,.94)!important;backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);box-shadow:0 10px 30px -12px rgba(0,0,0,.5)}
.mbar .pill--ember{box-shadow:0 10px 30px -12px rgba(232,99,44,.7)}

/* ============ page sections ============ */
.section{scroll-margin-top:64px;position:relative;z-index:2;background:var(--shade);padding:clamp(72px,9vw,140px) clamp(20px,5vw,60px)}
.section--alt{background:var(--shade-2)}
.section--ink{background:var(--ink);color:var(--paper-on-ink)}
.section--ink .eyebrow,.section--ink .lead{color:var(--paper-soft)}
.section--ink .lead{color:var(--paper-soft)}
.section--glow::before{content:"";position:absolute;inset:0;pointer-events:none;background:radial-gradient(60% 50% at 80% 10%, rgba(232,99,44,.22) 0%, rgba(232,99,44,0) 70%),radial-gradient(40% 40% at 10% 90%, rgba(255,177,92,.10) 0%, rgba(255,177,92,0) 70%)}
.section--ink::after{content:"";position:absolute;inset:0;pointer-events:none;opacity:.10;mix-blend-mode:screen;background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='140' height='140'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.85' numOctaves='3'/></filter><rect width='140' height='140' filter='url(%23n)' opacity='.5'/></svg>")}
.section > .wrap{position:relative;z-index:1}
.bridge{position:relative;z-index:2;height:clamp(140px,20vw,280px);background:linear-gradient(to bottom, var(--shade) 0%, #b9b3a8 45%, var(--ink) 100%)}
.bridge--up{background:linear-gradient(to bottom, var(--ink) 0%, #b9b3a8 55%, var(--shade) 100%)}
.bridge--alt{background:linear-gradient(to bottom, var(--ink) 0%, #b9b3a8 55%, var(--shade-2) 100%)}
.wrap{max-width:1240px;margin:0 auto}
.sec-head{display:grid;grid-template-columns:1.2fr .8fr;gap:24px 48px;align-items:end;margin-bottom:clamp(36px,5vw,64px)}
.sec-head .eyebrow{justify-content:flex-start;text-align:left;margin-bottom:14px}
h2{font-weight:400;font-size:clamp(32px,4.8vw,68px);line-height:.98;letter-spacing:-.034em;text-wrap:balance}
.lead{font-size:clamp(15px,1.2vw,18px);line-height:1.5;color:var(--fg-soft);max-width:46ch;text-wrap:pretty}
.em{color:var(--ember)}

/* reveal */
.rv{opacity:0;transform:translateY(22px);transition:opacity .9s var(--ease),transform .9s var(--ease)}
.rv.in{opacity:1;transform:none}

/* marquee */
.marq{position:relative;z-index:2;background:var(--shade);border-top:1px solid var(--rule-soft);border-bottom:1px solid var(--rule-soft);overflow:hidden;padding:18px 0;white-space:nowrap}
.marq .lbl{position:absolute;left:clamp(20px,5vw,60px);top:50%;transform:translateY(-50%);font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--fg-faint);background:var(--shade);padding-right:18px;z-index:1}
.marq .row{display:inline-flex;gap:56px;padding-left:56px;animation:marq 38s linear infinite}
.marq .row span{font-size:clamp(18px,1.8vw,24px);letter-spacing:-.02em;color:var(--fg-faint);display:inline-flex;align-items:center;gap:56px}
.marq .row span::after{content:"✦";font-size:10px;color:var(--ember)}
@keyframes marq{to{transform:translateX(-50%)}}

/* numbers band */
.band{display:grid;grid-template-columns:repeat(4,1fr);border-top:1px solid var(--rule-ink);border-bottom:1px solid var(--rule-ink)}
.band div{padding:26px 24px 26px 0;display:flex;flex-direction:column;gap:6px;border-right:1px solid var(--rule-ink-soft)}
.band div + div{padding-left:24px}
.band div:last-child{border-right:0}
.band b{font-weight:400;font-size:clamp(34px,4vw,56px);line-height:1;letter-spacing:-.045em}
.band b em{font-style:normal;color:var(--ember)}
.band span{font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--paper-faint)}

/* models grid */
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:clamp(16px,2vw,28px)}
.card{position:relative;border:1px solid var(--rule);border-radius:16px;overflow:hidden;background:var(--card);display:flex;flex-direction:column;transition:transform .5s var(--ease),box-shadow .5s var(--ease),border-color .5s}
.card:hover{transform:translateY(-4px);box-shadow:0 30px 60px -34px rgba(13,12,11,.45);border-color:rgba(13,12,11,.3)}
.card .view{position:relative;aspect-ratio:7/5;background:radial-gradient(120% 90% at 50% 100%, #e6e2da 0%, var(--card) 70%);overflow:hidden;cursor:grab;touch-action:pan-y}
.card .view canvas{width:100%;height:100%;position:absolute;inset:0}
.card .view .rot{position:absolute;right:12px;bottom:10px;font-size:10.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--fg-faint);display:flex;align-items:center;gap:6px;opacity:.9}
.card .view .rot::before{content:"";width:12px;height:12px;border:1.5px solid currentColor;border-radius:50%;border-right-color:transparent;transform:rotate(-30deg)}
.badge{position:absolute;top:12px;left:12px;z-index:2;font-size:10.5px;letter-spacing:.08em;text-transform:uppercase;padding:6px 10px;border-radius:999px;background:var(--ember);color:#fff}
.badge.soft{background:rgba(242,240,236,.9);color:var(--fg);border:1px solid var(--rule)}
.card-body{padding:18px 20px 20px;display:flex;flex-direction:column;gap:10px;flex:1}
.card-top{display:flex;justify-content:space-between;align-items:baseline;gap:10px}
.card h3{font-weight:500;font-size:19px;letter-spacing:-.02em}
.card .len{font-size:12px;color:var(--fg-faint);letter-spacing:.04em;white-space:nowrap}
.card p{font-size:14px;color:var(--fg-soft);line-height:1.5}
.card ul{list-style:none;display:flex;flex-wrap:wrap;gap:6px;margin-top:2px}
.card li{font-size:11.5px;letter-spacing:.02em;padding:5px 9px;border:1px solid var(--rule);border-radius:999px;color:var(--fg-soft)}
.card-foot{display:flex;justify-content:space-between;align-items:center;margin-top:auto;padding-top:14px;border-top:1px solid var(--rule-soft)}
.price{font-size:17px;letter-spacing:-.02em}
.price span{font-size:10.5px;color:var(--fg-faint);display:block;letter-spacing:.06em;text-transform:uppercase;margin-bottom:2px}
.card .go{font-size:13px;text-decoration:none;color:var(--fg);border-bottom:1px solid var(--ember);padding-bottom:1px}

/* configurator */
.cfg{display:grid;grid-template-columns:380px 1fr;gap:clamp(24px,3vw,48px);align-items:start}
.cfg-opts{display:flex;flex-direction:column;gap:26px}
.opt h4{font-size:11.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--paper-faint);margin-bottom:10px;display:flex;justify-content:space-between}
.opt h4 small{letter-spacing:.02em;text-transform:none;color:var(--ember)}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{padding:10px 14px;border:1px solid var(--rule-ink);border-radius:999px;font-size:13.5px;letter-spacing:-.005em;color:var(--paper-on-ink);transition:background .3s,border-color .3s,color .3s;display:inline-flex;align-items:center;gap:8px}
.chip small{font-size:11px;color:var(--paper-faint)}
.chip:hover{border-color:rgba(242,240,236,.5)}
.chip.on{background:var(--paper-on-ink);color:var(--ink);border-color:var(--paper-on-ink)}
.chip.on small{color:var(--fg-soft)}
.cfg-view{position:relative;border:1px solid var(--rule-ink);border-radius:20px;overflow:hidden;background:radial-gradient(80% 70% at 50% 100%, #2a2521 0%, #100f0e 70%);aspect-ratio:16/10;cursor:grab;touch-action:pan-y}
.cfg-view canvas{position:absolute;inset:0;width:100%;height:100%}
.cfg-view .hud{position:absolute;left:16px;top:14px;font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--paper-faint);display:flex;gap:14px}
.cfg-view .hud b{font-weight:400;color:var(--paper-on-ink)}
.cfg-sum{margin-top:18px;display:grid;grid-template-columns:1fr 1fr auto;gap:16px 28px;align-items:end;padding-top:18px;border-top:1px solid var(--rule-ink)}
.cfg-sum .k{font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--paper-faint);margin-bottom:6px}
.cfg-sum .v{font-size:clamp(22px,2.4vw,34px);letter-spacing:-.035em;line-height:1}
.cfg-sum .v small{font-size:13px;letter-spacing:0;color:var(--paper-faint);margin-left:8px}
.cfg-sum .fin{font-size:12.5px;color:var(--paper-soft);margin-top:6px}
.cfg-sum .fin b{font-weight:500;color:var(--ember-2)}
.section--ink .pill{background:var(--paper-on-ink);color:var(--ink);-webkit-text-fill-color:var(--ink);border-color:transparent}
.section--ink .pill:hover{background:#fff;color:var(--ink);-webkit-text-fill-color:var(--ink)}
.section--ink .pill--ember{background:var(--ember)!important;color:#fff!important;-webkit-text-fill-color:#fff!important}

/* florida tiles */
.tiles{display:grid;grid-template-columns:repeat(4,1fr);gap:clamp(14px,1.6vw,22px)}
.tile{border:1px solid var(--rule-ink);border-radius:16px;padding:26px 24px 24px;display:flex;flex-direction:column;gap:14px;background:linear-gradient(180deg, rgba(242,240,236,.05), rgba(242,240,236,.01));min-height:260px}
.tile .ic{width:40px;height:40px;border-radius:12px;background:rgba(232,99,44,.16);display:flex;align-items:center;justify-content:center;color:var(--ember-2)}
.tile .ic svg{width:20px;height:20px}
.tile h3{font-weight:500;font-size:18px;letter-spacing:-.02em}
.tile p{font-size:14px;line-height:1.55;color:var(--paper-soft)}
.tile .big{margin-top:auto;font-size:clamp(28px,2.8vw,40px);letter-spacing:-.04em;line-height:1}
.tile .big small{display:block;font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--paper-faint);margin-top:6px}

/* process */
.steps{display:grid;grid-template-columns:repeat(4,1fr);gap:0;border-top:1px solid var(--rule)}
.step{padding:28px 24px 34px 0;border-right:1px solid var(--rule-soft);display:flex;flex-direction:column;gap:14px}
.step:last-child{border-right:0}
.step + .step{padding-left:24px}
.step .n{font-size:clamp(44px,5vw,72px);line-height:1;letter-spacing:-.05em;color:var(--fg)}
.step .n::after{content:"";display:block;width:28px;height:2px;background:var(--ember);margin-top:14px}
.step h3{font-weight:500;font-size:18px;letter-spacing:-.02em}
.step .d{font-size:11.5px;letter-spacing:.06em;text-transform:uppercase;color:var(--fg-faint);margin-top:4px}
.step p{font-size:14.5px;line-height:1.55;color:var(--fg-soft)}

/* materials */
.mats{display:grid;grid-template-columns:repeat(3,1fr);gap:clamp(16px,2vw,28px)}
.mat{display:flex;flex-direction:column;gap:12px}
.sw{aspect-ratio:4/3;border-radius:14px;border:1px solid var(--rule);overflow:hidden;position:relative;margin-bottom:6px}
.sw::after{content:"";position:absolute;inset:0;background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='140' height='140'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.9' numOctaves='3'/></filter><rect width='140' height='140' filter='url(%23n)' opacity='.5'/></svg>");opacity:.18;mix-blend-mode:multiply}
.sw--brick{
  background-color:#d6d2cb;
  background-image:
    linear-gradient(335deg, #8e8680 23px, transparent 23px),
    linear-gradient(155deg, #a39b94 23px, transparent 23px),
    linear-gradient(335deg, #8e8680 23px, transparent 23px),
    linear-gradient(155deg, #a39b94 23px, transparent 23px);
  background-size:58px 116px;background-position:0 2px, 4px 35px, 29px 60px, 34px 93px;
}
.sw--concrete{background:radial-gradient(circle at 30% 20%, #eeebe5, #d9d5ce 60%, #cfcac2)}
.sw--steel{background:linear-gradient(100deg, #bdbdbb 0%, #ececea 30%, #b8b9b7 52%, #e6e6e4 70%, #c4c5c3 100%)}
.mat h3{font-weight:500;font-size:18px;letter-spacing:-.02em}
.mat p{font-size:14.5px;line-height:1.55;color:var(--fg-soft)}
.mat .spec{font-size:11.5px;letter-spacing:.06em;text-transform:uppercase;color:var(--fg-faint)}

/* compare table */
.cmp{width:100%;border-collapse:collapse;font-size:14.5px}
.cmp th,.cmp td{padding:16px 14px;border-bottom:1px solid var(--rule-soft);text-align:left;vertical-align:middle}
.cmp th{font-weight:400;font-size:11.5px;letter-spacing:.06em;text-transform:uppercase;color:var(--fg-faint)}
.cmp th:not(:first-child),.cmp td:not(:first-child){text-align:center;width:22%}
.cmp th.us{color:var(--fg)}
.cmp td.us{background:rgba(232,99,44,.06)}
.cmp .yes{display:inline-flex;width:24px;height:24px;border-radius:50%;background:var(--ember);color:#fff;align-items:center;justify-content:center;font-size:12px}
.cmp .no{display:inline-block;width:14px;height:1px;background:var(--fg-faint);vertical-align:middle}
.cmp .part{font-size:12px;color:var(--fg-faint)}

/* testimonials */
.quotes{display:grid;grid-template-columns:repeat(3,1fr);gap:clamp(16px,2vw,28px)}
.q{border:1px solid var(--rule-ink);border-radius:16px;padding:26px 26px 24px;display:flex;flex-direction:column;gap:18px;background:rgba(242,240,236,.04)}
.q p{font-size:clamp(16px,1.3vw,19px);line-height:1.45;letter-spacing:-.012em;text-wrap:pretty}
.q .q-who{font-size:12.5px;letter-spacing:.04em;text-transform:uppercase;margin-top:auto;color:var(--paper-soft)}
.q .stars{letter-spacing:2px;font-size:12px;color:var(--ember-2)}

/* warranty / financing */
.wf{display:grid;grid-template-columns:1fr 1fr;gap:clamp(16px,2vw,28px)}
.wf .box{border:1px solid var(--rule);border-radius:20px;padding:clamp(24px,3vw,40px);background:var(--card);display:flex;flex-direction:column;gap:14px;position:relative;overflow:hidden}
.wf .box.ink{background:var(--ink);color:var(--paper-on-ink);border-color:transparent}
.wf .box.ink::before{content:"";position:absolute;inset:0;background:radial-gradient(70% 60% at 100% 0%, rgba(232,99,44,.35), rgba(232,99,44,0) 70%)}
.wf .box > *{position:relative}
.wf .big{font-size:clamp(40px,5vw,76px);letter-spacing:-.05em;line-height:.95}
.wf .big small{display:block;font-size:12px;letter-spacing:.08em;text-transform:uppercase;margin-top:10px;opacity:.6}
.wf h3{font-weight:500;font-size:20px;letter-spacing:-.02em}
.wf p{font-size:14.5px;line-height:1.55;opacity:.75}
.wf ul{list-style:none;display:flex;flex-direction:column;gap:8px;font-size:14px;margin-top:4px}
.wf li{display:flex;gap:10px;align-items:flex-start}
.wf li::before{content:"";width:6px;height:6px;border-radius:50%;background:var(--ember);flex:none;margin-top:7px}

/* service map */
.area{display:grid;grid-template-columns:1fr 1fr;gap:clamp(24px,4vw,64px);align-items:center}
.map{position:relative}
.map svg{width:100%;height:auto;overflow:visible}
.map .fl{fill:var(--shade-2);stroke:var(--rule);stroke-width:.5}
.map .pt{fill:var(--ember)}
.map .ring{fill:none;stroke:var(--ember);stroke-width:.4;opacity:.5;transform-origin:center;transform-box:fill-box;animation:ring 2.8s var(--ease) infinite}
.map .hq{fill:var(--ink)}
.map text{font-size:2.6px;fill:var(--fg-soft);letter-spacing:.02em}
@keyframes ring{0%{transform:scale(.4);opacity:.7}100%{transform:scale(2.6);opacity:0}}
.cities{list-style:none;display:grid;grid-template-columns:1fr 1fr;gap:10px 24px;margin-top:22px}
.cities li{display:flex;justify-content:space-between;gap:10px;font-size:14.5px;padding:10px 0;border-bottom:1px solid var(--rule-soft)}
.cities li span{color:var(--fg-faint);font-size:12.5px}

/* faq */
.faq{display:grid;grid-template-columns:1fr 1fr;gap:0 clamp(24px,4vw,64px)}
.faq details{border-bottom:1px solid var(--rule-soft)}
.faq summary{list-style:none;cursor:pointer;padding:20px 0;display:flex;justify-content:space-between;align-items:center;gap:16px;font-size:16.5px;letter-spacing:-.015em}
.faq summary::-webkit-details-marker{display:none}
.faq summary::after{content:"+";font-size:22px;color:var(--ember);flex:none;transition:transform .3s}
.faq details[open] summary::after{transform:rotate(45deg)}
.faq details p{padding:0 0 20px;font-size:14.5px;line-height:1.55;color:var(--fg-soft);max-width:52ch}

/* quote form */
.quote{display:grid;grid-template-columns:1fr 1fr;gap:48px;align-items:start}
.contact{display:flex;flex-direction:column;gap:22px}
.contact dl{display:grid;grid-template-columns:auto 1fr;gap:10px 22px;font-size:14.5px}
.contact dt{color:var(--fg-faint);letter-spacing:.04em;text-transform:uppercase;font-size:11.5px;padding-top:3px}
.contact dd a{text-decoration:none;border-bottom:1px solid var(--rule)}
form{display:grid;grid-template-columns:1fr 1fr;gap:18px 20px}
.f{display:flex;flex-direction:column;gap:8px}
.f.full{grid-column:1 / -1}
label{font-size:11.5px;letter-spacing:.06em;text-transform:uppercase;color:var(--fg-faint)}
input,select,textarea{font:inherit;font-size:15px;color:var(--fg);background:transparent;border:0;border-bottom:1px solid var(--rule);padding:10px 0;border-radius:0;outline:none;transition:border-color .3s;-webkit-appearance:none;appearance:none}
select{background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='12' height='8'><path d='M1 1l5 5 5-5' fill='none' stroke='%230d0c0b' stroke-width='1.5'/></svg>");background-repeat:no-repeat;background-position:right 2px center;padding-right:20px}
textarea{resize:vertical;min-height:96px}
input:focus,select:focus,textarea:focus{border-bottom-color:var(--ember)}
.form-foot{grid-column:1 / -1;display:flex;align-items:center;justify-content:space-between;gap:16px;flex-wrap:wrap;margin-top:6px}
.form-foot small{font-size:12px;color:var(--fg-faint);line-height:1.4}

/* footer */
.foot{background:var(--ink);color:var(--paper-on-ink);padding:56px clamp(20px,5vw,60px) max(28px, calc(env(safe-area-inset-bottom, 0px) + 20px));position:relative;z-index:2}
.foot .wrap{display:grid;grid-template-columns:1.4fr 1fr 1fr 1fr;gap:28px}
.foot h4{font-weight:400;font-size:15px;letter-spacing:-.012em;margin-bottom:12px;display:flex;align-items:center;gap:8px}
.foot p,.foot li{font-size:13.5px;line-height:1.6;color:var(--paper-soft)}
.foot ul{list-style:none}
.foot a{text-decoration:none}
.foot a:hover{text-decoration:underline}
.foot .copy{grid-column:1 / -1;margin-top:30px;padding-top:18px;border-top:1px solid var(--rule-ink-soft);font-size:12px;color:var(--paper-faint);display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap}
.foot .big{grid-column:1 / -1;font-size:clamp(40px,9vw,140px);line-height:.9;letter-spacing:-.05em;margin:0 0 30px;color:var(--paper-on-ink);opacity:.95}
.foot .big em{font-style:normal;color:var(--ember)}

/* preloader */
.boot{position:fixed;inset:0;z-index:90;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;background:var(--shade);transition:opacity .7s var(--ease), visibility .7s}
.boot.done{opacity:0;visibility:hidden}
.boot p{font-size:12.5px;letter-spacing:.05em;color:var(--fg-faint)}
.bar{width:150px;height:1px;background:var(--rule);overflow:hidden}
.bar i{display:block;height:100%;width:100%;background:var(--ember);transform:scaleX(0);transform-origin:0 50%}

/* ============ breakpoints ============ */
@media (max-width:1100px){
  .cfg{grid-template-columns:1fr}
  .tiles{grid-template-columns:repeat(2,1fr)}
}
@media (max-width:1000px){
  .grid{grid-template-columns:repeat(2,1fr)}

}
@media (max-width:720px){

  .sub{font-size:15px;max-width:34ch}
  .panel{padding:max(92px, calc(env(safe-area-inset-top, 0px) + 76px)) 18px max(88px, calc(env(safe-area-inset-bottom, 0px) + 72px))}
  .hero-foot{font-size:11px}

}
@media (max-width:600px){

@media (max-height:520px) and (orientation:landscape){

}

const CUES = [ [0.00, 0.00, 0.12, 0.20], [0.34, 0.42, 0.52, 0.60], [0.68, 0.76, 0.86, 0.92], [0.945, 1.00, 1.20, 1.30] ];

function readScroll(){
  const r = hero.getBoundingClientRect();
  const span = r.height - window.innerHeight;
  progress = span > 0 ? clamp(-r.top / span, 0, 1) : 0;
  heroVisible = r.bottom > 0;
  const max = document.documentElement.scrollHeight - window.innerHeight;
  meter.style.transform = 'scaleX(' + (max > 0 ? clamp(window.pageYOffset / max, 0, 1) : 0) + ')';
  const past = r.bottom < window.innerHeight * 0.5;
  chromeEl.classList.toggle('solid', past);
  mbar.classList.toggle('on', past);
  // header goes dark while a dark section sits under it
  let dark = false; const y = 40;
  for (const s of darkSections){ const b = s.getBoundingClientRect(); if (b.top <= y && b.bottom >= y){ dark = true; break; } }
  chromeEl.classList.toggle('dark', dark);
}
function paint(){
  for (let i = 0; i < panels.length; i++){
    const c = CUES[i], el = panels[i];
    const enter = ramp(progress, c[0], c[1]), leave = ramp(progress, c[2], c[3]);
    const o = enter * (1 - leave), y = (1 - enter) * DRIFT - leave * DRIFT;
    el.style.opacity = o; el.style.transform = 'translate3d(0,' + y + 'px,0)'; el.style.pointerEvents = o > 0.6 ? 'auto' : 'none';
  }
}
document.querySelectorAll('[data-go]').forEach(a => a.addEventListener('click', e => {

}));

function hash(a, b){ let h = (a * 374761393 + b * 668265263) | 0; h = (h ^ (h >>> 13)) * 1274126177; return ((h ^ (h >>> 16)) >>> 0) / 4294967295; }
function brickTexture(){
  const W = 1024, H = 1024, cols = 4, rows = 13;

  for (let r = 0; r < rows; r++){ const off = (r % 2) ? bw / 2 : 0;
    for (let k = -1; k <= cols; k++){ const x = k * bw + off, y = r * bh, id = ((k % cols) + cols) % cols;
      const l = 30 + hash(r, id) * 26, s = 3 + hash(id, r) * 5;
      g.fillStyle = 'hsl(24 ' + s.toFixed(1) + '% ' + l.toFixed(1) + '%)';
      g.beginPath(); g.roundRect(x + m / 2, y + m / 2, bw - m, bh - m, 5); g.fill();
      g.fillStyle = 'rgba(255,255,255,' + (0.05 + hash(r + 9, id) * 0.08) + ')'; g.fillRect(x + m / 2, y + m / 2, bw - m, (bh - m) * 0.18);
      for (let n = 0; n < 5; n++){ g.fillStyle = 'rgba(0,0,0,' + (0.05 + hash(n, r * 7 + id) * 0.1) + ')';
        g.beginPath(); g.ellipse(x + m + hash(n + 3, r + id) * (bw - 2 * m), y + m + hash(n + 5, r * 3 + id) * (bh - 2 * m), 10 + hash(n, id) * 30, 6 + hash(id, n) * 14, 0, 0, Math.PI * 2); g.fill(); }
    } }
  const img = g.getImageData(0, 0, W, H), d = img.data;
  for (let i = 0; i < d.length; i += 4){ const n = (Math.random() - 0.5) * 22; d[i] += n; d[i + 1] += n; d[i + 2] += n; }
  g.putImageData(img, 0, 0);

  const t = new THREE.CanvasTexture(c); t.wrapS = t.wrapT = THREE.RepeatWrapping; t.colorSpace = THREE.SRGBColorSpace; t.anisotropy = 8; return t;
}

function buildRun(mods, bar){

    else if (t === 'oven'){ const o = mkOven(w); o.position.set(cx, BASE_H + 0.06, 0); g.add(o); g.add(brickBox(w, BASE_H, DEPTH, cx, BASE_H / 2, 0)); g.add(concreteBox(w + 0.06, 0.06, DEPTH + 0.06, cx, BASE_H + 0.03, 0)); }
    else { g.add(cavity(w, BASE_H, 0.60, cx, BASE_H / 2, 0.075)); }
    if (t === 'grill'){ const gw = w - 0.08; const gr = mkGrill(gw); gr.position.set(cx, 0.95, 0); g.add(gr); const hd = mkHood(gw); hd.position.set(cx, 1.10, 0); g.add(hd); const dr = mkDoors(w - 0.02); dr.position.set(cx, 0.40, DEPTH / 2); g.add(dr); }
    if (t === 'keg'){ const k = mkKeg(); k.position.set(cx, 0, 0); g.add(k); const tw = mkTower(); tw.position.set(cx, BASE_H + 0.06, 0); g.add(tw); }
    if (t === 'drawers'){ const d = mkDrawers(w - 0.02); d.position.set(cx, 0.40, DEPTH / 2); g.add(d); }
    if (t === 'sink'){ const s = mkSink(); s.position.set(cx, BASE_H + 0.06, 0); g.add(s); }
    if (t === 'burner'){ const b = mkBurner(); b.position.set(cx, BASE_H + 0.06, 0); g.add(b); }
    x += w; }
  g.add(brickBox(L, BASE_H, 0.15, 0, BASE_H / 2, -0.30));
  const ovenAt = mods.findIndex(m => m[0] === 'oven');
  const counterL = ovenAt >= 0 ? L - mods[ovenAt][1] : L, counterX = ovenAt >= 0 ? -mods[ovenAt][1] / 2 : 0;
  g.add(concreteBox(counterL + 0.12, 0.06, DEPTH + 0.09, counterX, BASE_H + 0.03, 0));

    [-1, 0, 1].forEach(i => { const s = mkStool(); s.position.set(i * 0.9, 0, -0.95); g.add(s); }); }

}

function cfgResize(){ if (!cfgR) return; const w = cfgView.clientWidth || 800, h = cfgView.clientHeight || 500; cfgR.setSize(w, h, false); cCam.aspect = w / h; cCam.updateProjectionMatrix(); cfg.dirty = true; }
function cfgSpec(){
  const gw = cfgState.grill === 'g32' ? 0.9 : cfgState.grill === 'g42' ? 1.15 : 1.0;
  const m = cfgState.mods, L = cfgState.layout === 'l';
  const mods = [['col', .55]];
  if (m.has('burner')) mods.push(['burner', .5]);
  mods.push(['grill', gw], ['col', .3]);
  if (m.has('drawers')) mods.push(['drawers', .8]);
  if (m.has('sink') && !L) mods.push(['sink', .7]);
  if (m.has('keg')) mods.push(['keg', .7]);
  mods.push(['col', .55]);
  if (m.has('oven')) mods.push(['col', .2], ['oven', 1.1]);
  const spec = { mods, bar: cfgState.layout === 'bar' };
  if (L) spec.wing = [['col', .5], m.has('sink') ? ['sink', .8] : ['col', .8], ['col', .5]];
  return spec;
}
function cfgPrice(){
  const o = cfg.obj.userData, len = o.L + o.Lw;
  let p = PRICE.base + Math.round(len * PRICE.perM) + PRICE[cfgState.grill];
  cfgState.mods.forEach(k => p += PRICE[k]);
  if (cfgState.layout === 'bar') p += PRICE.bar; if (cfgState.layout === 'l') p += PRICE.l;
  return { p: Math.round(p / 100) * 100, len };
}
function updateCfg(){
  if (cfg.obj){ if (cScene) cScene.remove(cfg.obj); disposeTree(cfg.obj); }
  cfg.obj = buildKitchen(cfgSpec()); cfg.obj.rotation.y = cfg.yaw; if (cScene) cScene.add(cfg.obj); cfg.dirty = true;
  const T = I18N[lang].cfg, { p, len } = cfgPrice();
  $('#cfgPrice').innerHTML = money(p) + '<small>±8%</small>';
  $('#cfgFin').innerHTML = T.fin.replace('{m}', money(Math.round(p / 24)));
  $('#cfgLen').textContent = lang === 'pt' ? len.toFixed(1).replace('.', ',') + ' m' : (len * 3.281).toFixed(0) + ' ft';
  $('#cfgDays').textContent = (cfgState.mods.has('oven') || cfgState.layout === 'l') ? T.days4 : T.days;
  document.querySelectorAll('#cfgOpts .chip').forEach(ch => { const k = ch.dataset.group, v = ch.dataset.val; ch.classList.toggle('on', k === 'mods' ? cfgState.mods.has(v) : cfgState[k] === v); });
}
function renderCfgOpts(){
  const T = I18N[lang].cfg;
  $('#cfgOpts').innerHTML = T.groups.map(g => '<div class="opt"><h4>' + g.name + (g.single ? '' : '<small>' + (lang === 'pt' ? 'escolha vários' : 'pick any') + '</small>') + '</h4><div class="chips">' +
    g.opts.map(o => '<button class="chip" data-group="' + g.key + '" data-val="' + o[0] + '">' + o[1] + (o[2] ? '<small>' + o[2] + '</small>' : '') + '</button>').join('') + '</div></div>').join('');
  document.querySelectorAll('#cfgOpts .chip').forEach(ch => ch.addEventListener('click', () => {
    const k = ch.dataset.group, v = ch.dataset.val;
    if (k === 'mods'){ cfgState.mods.has(v) ? cfgState.mods.delete(v) : cfgState.mods.add(v); } else cfgState[k] = v;
    updateCfg();
  }));
}
function cfgSummary(){
  const T = I18N[lang].cfg, names = {};
  T.groups.forEach(g => g.opts.forEach(o => names[o[0]] = o[1]));
  const { p, len } = cfgPrice();
  return [T.groups[0].name + ': ' + names[cfgState.grill], T.groups[1].name + ': ' + ([...cfgState.mods].map(k => names[k]).join(', ') || '-'), T.groups[2].name + ': ' + names[cfgState.layout], T.hud1 + ': ' + $('#cfgLen').textContent, T.k1 + ': ' + money(p)].join('\n');
}
$('#cfgSend').addEventListener('click', () => { const sel = $('#fModel'); sel.value = 'custom'; $('#fMsg').value = cfgSummary(); });
cfgView.addEventListener('pointerdown', e => { cfg.dragging = true; cfg.lastX = e.clientX; cfg.vel = 0; cfgView.setPointerCapture(e.pointerId); });
cfgView.addEventListener('pointermove', e => { if (!cfg.dragging) return; cfg.vel = (e.clientX - cfg.lastX) * 0.006; cfg.yaw += cfg.vel; cfg.lastX = e.clientX; cfg.dirty = true; cfg.idle = 0; });
window.addEventListener('pointerup', () => { cfg.dragging = false; });
function tickCfg(dt){
  if (!cfgR || !cfg.vis || !cfg.obj) return;
  if (!cfg.dragging){ cfg.vel *= Math.exp(-dt * 4); if (Math.abs(cfg.vel) > 0.0005){ cfg.yaw += cfg.vel; cfg.dirty = true; } cfg.idle += dt; if (cfg.idle > 2.5){ cfg.yaw += dt * 0.12; cfg.dirty = true; } }
  if (!cfg.dirty) return;
  cfg.obj.rotation.y = cfg.yaw;
  const R = cfg.obj.userData.radius, d = R / Math.sin(THREE.MathUtils.degToRad(cCam.fov) / 2) * 0.82, pitch = 0.30;
  cCam.position.set(0, 0.5 + d * Math.sin(pitch), d * Math.cos(pitch)); cCam.lookAt(0, 0.5, 0);
  cfgR.render(cScene, cCam); cfg.dirty = false;
}
new IntersectionObserver(es => es.forEach(en => { cfg.vis = en.isIntersecting; if (cfg.vis){ cfgResize(); cfg.idle = 0; } }), { rootMargin: '120px' }).observe(cfgView);

/* ------------------------------------------------------------ form -> mailto */
$('#quoteForm').addEventListener('submit', e => {
  e.preventDefault(); const T = I18N[lang].form, f = e.target;
  const model = f.model.value === 'custom' ? T.custom : (f.model.value || T.any);
  const body = [T.name + ': ' + f.name.value, T.email + ': ' + f.email.value, T.city + ': ' + f.city.value, T.model + ': ' + model, '', f.message.value].join('\n');
  location.href = 'mailto:hello@hearthandslab.com?subject=' + encodeURIComponent(T.subject) + '&body=' + encodeURIComponent(body);
});

/* ------------------------------------------------------------ boot */
resize();
applyLang();
window.addEventListener('scroll', readScroll, { passive: true });
readScroll(); paint(); eased = progress; lastEased = eased;
renderer.compile(scene, camera);
setProgress(0.85);
requestAnimationFrame(() => {
  frame(); setProgress(1); window.__hs_ready = true;
  setTimeout(() => boot.classList.add('done'), 250);
  setTimeout(() => { initThumb(); cards.forEach(c => { if (c.vis) renderCard(c); }); }, 400);
  setTimeout(() => { initCfgR(); cfg.dirty = true; }, 900);
});
</script>
</body>
