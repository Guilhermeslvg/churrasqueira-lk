<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Hearth &amp; Slab — Cozinhas Externas</title>
<meta name="description" content="Cozinhas externas em tijolo, concreto e inox, construídas no seu quintal em três dias.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter+Tight:wght@400;500&display=swap" rel="stylesheet">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%230d0c0b'/%3E%3Ctext x='16' y='22' text-anchor='middle' font-family='Helvetica,Arial' font-size='18' fill='%23f2f0ec'%3E%E2%9C%B5%3C/text%3E%3C/svg%3E">
<style>
:root{
  --fg:#0d0c0b;
  --fg-soft:rgba(13,12,11,.64);
  --fg-faint:rgba(13,12,11,.42);
  --shade:#f2f0ec;
  --shade-2:#ebe8e2;
  --card:#f7f5f1;
  --rule:rgba(13,12,11,.16);
  --rule-soft:rgba(13,12,11,.08);
  --ease:cubic-bezier(.22,.61,.36,1);
  --pill-bg:#0a0908;
  --pill-fg:#ffffff;
}
*{box-sizing:border-box;margin:0;padding:0}
html{-webkit-text-size-adjust:100%;scroll-behavior:smooth}
body{
  background:var(--shade); color:var(--fg);
  font-family:'Inter Tight','Helvetica Neue',Helvetica,Arial,sans-serif; font-weight:400;
  -webkit-font-smoothing:antialiased; -moz-osx-font-smoothing:grayscale; overflow-x:hidden;
}
a{color:inherit}
img,canvas{display:block}

/* ============ sticky 3D hero ============ */
.hero{position:relative;height:640vh;min-height:3600px;z-index:1}
.hero-stick{position:sticky;top:0;height:100vh;height:100svh;overflow:hidden}
.stage{position:absolute;inset:0;z-index:0;overflow:hidden;background:var(--shade)}
.stage canvas{position:absolute;inset:0;width:100%;height:100%}
.veil{
  position:absolute;inset:0;pointer-events:none;
  background:
    linear-gradient(to bottom, rgba(242,240,236,.62) 0%, rgba(242,240,236,.06) 22%, rgba(242,240,236,.06) 78%, rgba(242,240,236,.66) 100%),
    radial-gradient(100% 80% at 50% 48%, rgba(242,240,236,0) 0%, rgba(242,240,236,.22) 100%);
}
.grain{
  position:absolute;inset:-50%;opacity:.13;mix-blend-mode:multiply;pointer-events:none;
  background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='140' height='140'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.85' numOctaves='3'/></filter><rect width='140' height='140' filter='url(%23n)' opacity='.5'/></svg>");
}
.tags{position:absolute;inset:0;z-index:15;pointer-events:none;overflow:hidden}
.tag{position:absolute;left:0;top:0;opacity:0;will-change:transform,opacity;display:flex;align-items:center;gap:10px;white-space:nowrap;font-size:12.5px;letter-spacing:.02em;color:var(--fg);transform:translate3d(-9999px,-9999px,0)}
.tag .dot{width:7px;height:7px;border-radius:50%;background:var(--fg);flex:none;box-shadow:0 0 0 3px rgba(242,240,236,.9);display:flex;align-items:center;justify-content:center}
.tag .dot i{display:none;font-style:normal;font-size:10px;font-weight:500;color:#fff;letter-spacing:0}
.tag .line{width:34px;height:1px;background:var(--fg);opacity:.55;flex:none}
.tag .txt{display:flex;flex-direction:column;gap:2px;line-height:1.2;background:rgba(242,240,236,.72);padding:6px 9px;border-radius:4px;backdrop-filter:blur(4px)}
.tag b{font-weight:500;font-size:12.5px;letter-spacing:-.005em}
.tag b span{color:var(--fg-faint);font-weight:400;margin-right:8px}
.tag em{font-style:normal;color:var(--fg-soft);font-size:11px;letter-spacing:.03em}
.tag.flip{flex-direction:row-reverse}
.tag.flip .txt{text-align:right}
.legend{display:none;list-style:none;margin-top:14px;gap:6px 14px;flex-wrap:wrap;justify-content:center;font-size:11.5px;letter-spacing:.02em;color:var(--fg-soft)}
.legend b{font-weight:400;color:var(--fg-faint);margin-right:4px}

.panels{position:absolute;inset:0;z-index:20;pointer-events:none}
.panel{
  position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;
  padding:max(104px, calc(env(safe-area-inset-top, 0px) + 88px)) clamp(20px, 5vw, 60px) max(96px, calc(env(safe-area-inset-bottom, 0px) + 80px));
  opacity:0;will-change:opacity,transform;
}
.panel--low{justify-content:flex-end}
.panel--low h1{font-size:clamp(26px, 3.6vw, 54px);max-width:18ch}
.panel--low .sub{margin-top:clamp(12px,1.4vw,18px);max-width:40ch}
.eyebrow{display:flex;align-items:center;justify-content:center;flex-wrap:wrap;gap:6px 12px;font-size:12.5px;letter-spacing:.045em;text-transform:uppercase;color:var(--fg-soft);margin-bottom:clamp(16px,2vw,22px);max-width:min(46ch,100%);text-align:center}
h1{font-weight:400;font-size:clamp(34px, 7.1vw, 104px);line-height:.98;letter-spacing:-.036em;max-width:15ch;text-wrap:balance}
.sub{margin-top:clamp(18px,2.2vw,28px);font-size:clamp(15px,1.28vw,19px);line-height:1.5;letter-spacing:-.008em;color:var(--fg-soft);max-width:min(46ch,100%);text-wrap:pretty}
.cta{margin-top:clamp(28px,3.4vw,44px);pointer-events:auto;width:100%;display:flex;justify-content:center;gap:12px;flex-wrap:wrap}
.cta .pill{height:48px;padding:0 27px;font-size:15px;max-width:min(100%,320px)}
.pill--ghost{background:transparent!important;color:var(--fg)!important;-webkit-text-fill-color:var(--fg)!important;border-color:var(--rule)!important}
.hint{margin-top:22px;font-size:11.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--fg-faint);display:flex;align-items:center;gap:8px}
.hint i{display:block;width:1px;height:26px;background:var(--fg-faint);animation:drop 1.8s var(--ease) infinite;transform-origin:0 0}
@keyframes drop{0%{transform:scaleY(0)}50%{transform:scaleY(1)}100%{transform:scaleY(0);transform-origin:0 100%}}
.stats{margin-top:clamp(22px,2.6vw,34px);display:flex;gap:clamp(18px,3vw,44px);flex-wrap:wrap;justify-content:center;pointer-events:none}
.stats div{display:flex;flex-direction:column;gap:3px;font-size:12px;letter-spacing:.04em;text-transform:uppercase;color:var(--fg-faint)}
.stats div b{font-weight:400;font-size:clamp(20px,2vw,28px);letter-spacing:-.03em;color:var(--fg);text-transform:none}
.hero-foot{
  position:absolute;bottom:0;left:0;right:0;z-index:22;display:flex;justify-content:center;
  padding:14px clamp(16px, 4vw, 24px) max(16px, calc(env(safe-area-inset-bottom, 0px) + 12px));
  font-size:12px;line-height:1.45;letter-spacing:.02em;color:var(--fg-faint);text-align:center;pointer-events:none;
  background:linear-gradient(to top, rgba(242,240,236,.92) 0%, rgba(242,240,236,.72) 72%, rgba(242,240,236,0) 100%);
}

/* ============ chrome ============ */
.chrome{
  position:fixed;left:0;right:0;top:0;z-index:40;display:flex;align-items:center;justify-content:space-between;gap:12px;
  padding:max(14px, calc(env(safe-area-inset-top, 0px) + 12px)) clamp(16px, 3.4vw, 44px) 14px;
  background:linear-gradient(to bottom, rgba(242,240,236,.94) 0%, rgba(242,240,236,.78) 72%, rgba(242,240,236,0) 100%);
  transition:background .4s var(--ease);
}
.chrome.solid{background:rgba(242,240,236,.92);backdrop-filter:blur(10px);border-bottom:1px solid var(--rule-soft)}
.mark{display:flex;align-items:center;gap:9px;font-size:15px;letter-spacing:-.012em;color:var(--fg);min-width:0;flex-shrink:1;text-decoration:none}
.mark-star{opacity:.85}
.nav{display:flex;align-items:center;gap:clamp(14px, 2.4vw, 32px);flex-shrink:0}
.nav a:not(.pill):not(.lang){color:var(--fg);text-decoration:none;font-size:14.5px;letter-spacing:-.008em;opacity:.88;transition:opacity .3s var(--ease);cursor:pointer}
.nav a:not(.pill):hover{opacity:1}
.lang{display:inline-flex;gap:0;border:1px solid var(--rule);border-radius:999px;overflow:hidden;font-size:12px;letter-spacing:.04em;cursor:pointer;user-select:none;text-decoration:none}
.lang span{padding:7px 10px;color:var(--fg-faint);transition:background .3s,color .3s}
.lang span.on{background:var(--fg);color:#fff}
.pill{
  display:inline-flex;align-items:center;justify-content:center;height:40px;padding:0 21px;border-radius:999px;
  background:var(--pill-bg);color:var(--pill-fg);font-size:14.5px;font-weight:500;letter-spacing:-.008em;text-decoration:none;
  white-space:nowrap;opacity:1;border:1px solid rgba(10,9,8,.12);box-shadow:0 1px 0 rgba(255,255,255,.10) inset;
  -webkit-text-fill-color:var(--pill-fg);cursor:pointer;font-family:inherit;
  transition:transform .4s var(--ease), background .3s var(--ease), color .3s var(--ease);
}
.nav .pill{color:#fff;-webkit-text-fill-color:#fff}
.pill:hover,.pill:focus-visible{transform:translateY(-2px);background:#000;color:#fff;-webkit-text-fill-color:#fff}
.pill:focus-visible{outline:2px solid var(--fg);outline-offset:2px}
.meter{position:fixed;top:0;left:0;z-index:50;height:2px;width:100%;transform:scaleX(0);transform-origin:0 50%;background:var(--fg);opacity:.55}

/* ============ page sections ============ */
.section{scroll-margin-top:64px;position:relative;z-index:2;background:var(--shade);padding:clamp(72px,9vw,140px) clamp(20px,5vw,60px)}
.section--alt{background:var(--shade-2)}
.section--dark{background:var(--fg);color:var(--shade)}
.section--dark .eyebrow,.section--dark .lead,.section--dark .q-who{color:rgba(242,240,236,.6)}
.wrap{max-width:1240px;margin:0 auto}
.sec-head{display:grid;grid-template-columns:1.2fr .8fr;gap:24px 48px;align-items:end;margin-bottom:clamp(36px,5vw,64px)}
.sec-head .eyebrow{justify-content:flex-start;text-align:left;margin-bottom:14px}
h2{font-weight:400;font-size:clamp(32px,4.8vw,68px);line-height:.98;letter-spacing:-.034em;text-wrap:balance}
.lead{font-size:clamp(15px,1.2vw,18px);line-height:1.5;color:var(--fg-soft);max-width:46ch;text-wrap:pretty}

/* reveal */
.rv{opacity:0;transform:translateY(22px);transition:opacity .9s var(--ease),transform .9s var(--ease)}
.rv.in{opacity:1;transform:none}

/* models grid */
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:clamp(16px,2vw,28px)}
.card{position:relative;border:1px solid var(--rule);border-radius:16px;overflow:hidden;background:var(--card);display:flex;flex-direction:column;transition:transform .5s var(--ease),box-shadow .5s var(--ease),border-color .5s}
.card:hover{transform:translateY(-4px);box-shadow:0 30px 60px -34px rgba(13,12,11,.45);border-color:rgba(13,12,11,.3)}
.card .view{position:relative;aspect-ratio:7/5;background:radial-gradient(120% 90% at 50% 100%, #e6e2da 0%, var(--card) 70%);overflow:hidden;cursor:grab}
.card .view canvas{width:100%;height:100%;position:absolute;inset:0}
.card .view .rot{position:absolute;right:12px;bottom:10px;font-size:10.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--fg-faint);display:flex;align-items:center;gap:6px;opacity:.9}
.card .view .rot::before{content:"";width:12px;height:12px;border:1.5px solid currentColor;border-radius:50%;border-right-color:transparent;transform:rotate(-30deg)}
.badge{position:absolute;top:12px;left:12px;z-index:2;font-size:10.5px;letter-spacing:.08em;text-transform:uppercase;padding:6px 10px;border-radius:999px;background:var(--fg);color:#fff}
.badge.soft{background:rgba(242,240,236,.9);color:var(--fg);border:1px solid var(--rule)}
.card-body{padding:18px 20px 20px;display:flex;flex-direction:column;gap:10px;flex:1}
.card-top{display:flex;justify-content:space-between;align-items:baseline;gap:10px}
.card h3{font-weight:500;font-size:19px;letter-spacing:-.02em}
.card .len{font-size:12px;color:var(--fg-faint);letter-spacing:.04em;white-space:nowrap}
.card p{font-size:14px;color:var(--fg-soft);line-height:1.5}
.card ul{list-style:none;display:flex;flex-wrap:wrap;gap:6px;margin-top:2px}
.card li{font-size:11.5px;letter-spacing:.02em;padding:5px 9px;border:1px solid var(--rule);border-radius:999px;color:var(--fg-soft)}
.card-foot{display:flex;justify-content:space-between;align-items:center;margin-top:auto;padding-top:14px;border-top:1px solid var(--rule-soft)}
.price{font-size:17px;letter-spacing:-.02em}
.price span{font-size:10.5px;color:var(--fg-faint);display:block;letter-spacing:.06em;text-transform:uppercase;margin-bottom:2px}
.card .go{font-size:13px;text-decoration:none;color:var(--fg);border-bottom:1px solid var(--fg);padding-bottom:1px}

/* process */
.steps{display:grid;grid-template-columns:repeat(4,1fr);gap:0;border-top:1px solid var(--rule)}
.step{padding:28px 24px 34px 0;border-right:1px solid var(--rule-soft);display:flex;flex-direction:column;gap:14px}
.step:last-child{border-right:0}
.step + .step{padding-left:24px}
.step .n{font-size:clamp(44px,5vw,72px);line-height:1;letter-spacing:-.05em;color:var(--fg)}
.step h3{font-weight:500;font-size:18px;letter-spacing:-.02em}
.step .d{font-size:11.5px;letter-spacing:.06em;text-transform:uppercase;color:var(--fg-faint);margin-top:4px}
.step p{font-size:14.5px;line-height:1.55;color:var(--fg-soft)}

/* materials */
.mats{display:grid;grid-template-columns:repeat(3,1fr);gap:clamp(16px,2vw,28px)}
.mat{display:flex;flex-direction:column;gap:12px}
.sw{aspect-ratio:4/3;border-radius:14px;border:1px solid var(--rule);overflow:hidden;position:relative;margin-bottom:6px}
.sw::after{content:"";position:absolute;inset:0;background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='140' height='140'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.9' numOctaves='3'/></filter><rect width='140' height='140' filter='url(%23n)' opacity='.5'/></svg>");opacity:.18;mix-blend-mode:multiply}
.sw--brick{
  background-color:#d6d2cb;
  background-image:
    linear-gradient(335deg, #8e8680 23px, transparent 23px),
    linear-gradient(155deg, #a39b94 23px, transparent 23px),
    linear-gradient(335deg, #8e8680 23px, transparent 23px),
    linear-gradient(155deg, #a39b94 23px, transparent 23px);
  background-size:58px 116px;background-position:0 2px, 4px 35px, 29px 60px, 34px 93px;
}
.sw--concrete{background:radial-gradient(circle at 30% 20%, #eeebe5, #d9d5ce 60%, #cfcac2)}
.sw--steel{background:linear-gradient(100deg, #bdbdbb 0%, #ececea 30%, #b8b9b7 52%, #e6e6e4 70%, #c4c5c3 100%)}
.mat h3{font-weight:500;font-size:18px;letter-spacing:-.02em}
.mat p{font-size:14.5px;line-height:1.55;color:var(--fg-soft)}
.mat .spec{font-size:11.5px;letter-spacing:.06em;text-transform:uppercase;color:var(--fg-faint)}

/* testimonials */
.quotes{display:grid;grid-template-columns:repeat(3,1fr);gap:clamp(16px,2vw,28px)}
.q{border:1px solid rgba(242,240,236,.18);border-radius:16px;padding:26px 26px 24px;display:flex;flex-direction:column;gap:18px;background:rgba(242,240,236,.04)}
.q p{font-size:clamp(16px,1.3vw,19px);line-height:1.45;letter-spacing:-.012em;text-wrap:pretty}
.q .q-who{font-size:12.5px;letter-spacing:.04em;text-transform:uppercase;margin-top:auto}
.q .stars{letter-spacing:2px;font-size:12px;color:rgba(242,240,236,.8)}

/* quote form */
.quote{display:grid;grid-template-columns:1fr 1fr;gap:48px;align-items:start}
.contact{display:flex;flex-direction:column;gap:22px}
.contact dl{display:grid;grid-template-columns:auto 1fr;gap:10px 22px;font-size:14.5px}
.contact dt{color:var(--fg-faint);letter-spacing:.04em;text-transform:uppercase;font-size:11.5px;padding-top:3px}
.contact dd a{text-decoration:none;border-bottom:1px solid var(--rule)}
form{display:grid;grid-template-columns:1fr 1fr;gap:18px 20px}
.f{display:flex;flex-direction:column;gap:8px}
.f.full{grid-column:1 / -1}
label{font-size:11.5px;letter-spacing:.06em;text-transform:uppercase;color:var(--fg-faint)}
input,select,textarea{font:inherit;font-size:15px;color:var(--fg);background:transparent;border:0;border-bottom:1px solid var(--rule);padding:10px 0;border-radius:0;outline:none;transition:border-color .3s;-webkit-appearance:none;appearance:none}
select{background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='12' height='8'><path d='M1 1l5 5 5-5' fill='none' stroke='%230d0c0b' stroke-width='1.5'/></svg>");background-repeat:no-repeat;background-position:right 2px center;padding-right:20px}
textarea{resize:vertical;min-height:96px}
input:focus,select:focus,textarea:focus{border-bottom-color:var(--fg)}
.form-foot{grid-column:1 / -1;display:flex;align-items:center;justify-content:space-between;gap:16px;flex-wrap:wrap;margin-top:6px}
.form-foot small{font-size:12px;color:var(--fg-faint);line-height:1.4}

/* footer */
.foot{background:var(--shade-2);border-top:1px solid var(--rule);padding:44px clamp(20px,5vw,60px) max(28px, calc(env(safe-area-inset-bottom, 0px) + 20px));position:relative;z-index:2}
.foot .wrap{display:grid;grid-template-columns:1.4fr 1fr 1fr;gap:28px}
.foot h4{font-weight:400;font-size:15px;letter-spacing:-.012em;margin-bottom:12px;display:flex;align-items:center;gap:8px}
.foot p,.foot li{font-size:13.5px;line-height:1.6;color:var(--fg-soft)}
.foot ul{list-style:none}
.foot a{text-decoration:none}
.foot a:hover{text-decoration:underline}
.foot .copy{grid-column:1 / -1;margin-top:26px;padding-top:18px;border-top:1px solid var(--rule-soft);font-size:12px;color:var(--fg-faint);display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap}

/* preloader */
.boot{position:fixed;inset:0;z-index:90;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;background:var(--shade);transition:opacity .7s var(--ease), visibility .7s}
.boot.done{opacity:0;visibility:hidden}
.boot p{font-size:12.5px;letter-spacing:.05em;color:var(--fg-faint)}
.bar{width:150px;height:1px;background:var(--rule);overflow:hidden}
.bar i{display:block;height:100%;width:100%;background:var(--fg);transform:scaleX(0);transform-origin:0 50%}

/* ============ breakpoints ============ */
@media (max-width:1000px){
  .grid{grid-template-columns:repeat(2,1fr)}
  .steps{grid-template-columns:repeat(2,1fr)}
  .step{border-right:0;border-bottom:1px solid var(--rule-soft)}
  .step + .step{padding-left:0}
  .step:nth-child(odd){padding-right:24px;border-right:1px solid var(--rule-soft)}
  .step:nth-child(even){padding-left:24px}
  .quotes{grid-template-columns:1fr}
  .quote{grid-template-columns:1fr;gap:36px}
  .foot .wrap{grid-template-columns:1fr 1fr}
}
@media (max-width:900px){
  .veil{
    background:
      linear-gradient(to bottom, rgba(242,240,236,.72) 0%, rgba(242,240,236,.12) 24%, rgba(242,240,236,.12) 76%, rgba(242,240,236,.74) 100%),
      radial-gradient(100% 80% at 50% 48%, rgba(242,240,236,0) 0%, rgba(242,240,236,.28) 100%);
  }
  .sec-head{grid-template-columns:1fr;gap:16px}
}
@media (max-width:720px){
  .nav a:not(.pill):not(.lang){display:none}
  .mark{font-size:14px}
  .nav .pill{height:38px;padding:0 16px;font-size:13.5px}
  .lang span{padding:6px 8px}
  h1{max-width:12ch;font-size:clamp(30px, 9.8vw, 52px)}
  .panel--low h1{font-size:clamp(22px, 6.4vw, 34px)}
  .sub{font-size:15px;max-width:34ch}
  .panel{padding:max(92px, calc(env(safe-area-inset-top, 0px) + 76px)) 18px max(88px, calc(env(safe-area-inset-bottom, 0px) + 72px))}
  .hero-foot{font-size:11px}
  .tag .line,.tag .txt{display:none}
  .tag .dot{width:22px;height:22px}
  .tag .dot i{display:block}
  .legend{display:flex}
  .mats{grid-template-columns:1fr}
  form{grid-template-columns:1fr}
}
@media (max-width:600px){
  .grid{grid-template-columns:1fr}
  .steps{grid-template-columns:1fr}
  .step:nth-child(odd){padding-right:0;border-right:0}
  .step:nth-child(even){padding-left:0}
  .foot .wrap{grid-template-columns:1fr}
}
@media (max-width:420px){
  .mark-star{display:none}
  .nav .pill{height:36px;padding:0 14px;font-size:13px}
  h1{max-width:11ch;font-size:clamp(28px, 10.5vw, 40px)}
  .eyebrow{font-size:11px;letter-spacing:.04em;max-width:28ch}
  .cta .pill{width:100%;max-width:280px;height:44px;padding:0 20px;font-size:14px}
}

const CUES = [ [0.00, 0.00, 0.12, 0.20], [0.34, 0.42, 0.52, 0.60], [0.68, 0.76, 0.86, 0.92], [0.945, 1.00, 1.20, 1.30] ];

function readScroll(){
  const r = hero.getBoundingClientRect();

  heroVisible = r.bottom > 0;

  meter.style.transform = 'scaleX(' + (max > 0 ? clamp(window.pageYOffset / max, 0, 1) : 0) + ')';

function paint(){

    for (let k = -1; k <= cols; k++){ const x = k * bw + off, y = r * bh, id = ((k % cols) + cols) % cols;
      const l = 30 + hash(r, id) * 26, s = 3 + hash(id, r) * 5;

      g.fillStyle = 'rgba(255,255,255,' + (0.05 + hash(r + 9, id) * 0.08) + ')'; g.fillRect(x + m / 2, y + m / 2, bw - m, (bh - m) * 0.18);
      for (let n = 0; n < 5; n++){ g.fillStyle = 'rgba(0,0,0,' + (0.05 + hash(n, r * 7 + id) * 0.1) + ')';
        g.beginPath(); g.ellipse(x + m + hash(n + 3, r + id) * (bw - 2 * m), y + m + hash(n + 5, r * 3 + id) * (bh - 2 * m), 10 + hash(n, id) * 30, 6 + hash(id, n) * 14, 0, 0, Math.PI * 2); g.fill(); }

    for (const p of parts){ p.obj.position.copy(p.home).addScaledVector(p.dir, es); if (p.tilt) p.obj.rotation.x = p.tilt * es; }
    const narrow = camera.aspect < 0.8;
    const vF = THREE.MathUtils.degToRad(camera.fov), hF = 2 * Math.atan(Math.tan(vF / 2) * camera.aspect);
    const halfW = 2.05 + es * 0.75, halfH = 1.12 + es * (narrow ? 0.85 : 1.5);
    const dist = Math.max(halfW / Math.tan(hF / 2), halfH / Math.tan(vF / 2)) * (narrow ? 1.0 : 1.06);
    const pitch = 0.30 + es * 0.12 + my * 0.03, ty = 0.60 - es * (narrow ? 0.34 : 0.27);
    camera.position.set(mx * 0.3, ty + dist * Math.sin(pitch), dist * Math.cos(pitch)); camera.lookAt(0, ty, 0);
    renderer.render(scene, camera);
    paint(); paintTags(ramp(e, 0.55, 0.95));
  }
  tickCards(dt);
  requestAnimationFrame(frame);
}

/* ------------------------------------------------------------ model cards: six kitchens, one small shared renderer */
const VARIANTS = [
  { badge:'top', mods:[['col',.85],['grill',1.0],['col',.3],['keg',.7],['col',.55]] },
  { mods:[['col',.6],['grill',.9],['col',.9]] },
  { mods:[['col',.85],['grill',1.0],['col',.3],['keg',.7],['col',.55]], wing:[['sink',.9],['col',.9]] },
  { mods:[['col',.9],['grill',1.0],['col',.3],['keg',.7],['col',.7]], bar:true },
  { badge:'new', mods:[['col',.6],['grill',1.0],['col',.3],['drawers',.9],['col',.3],['oven',1.1]] },
  { mods:[['col',.5],['burner',.5],['grill',1.15],['col',.25],['drawers',.8],['sink',.7],['keg',.7]] }
];
function buildRun(mods, bar){
  const g = new THREE.Group(); const L = mods.reduce((s, m) => s + m[1], 0); let x = -L / 2;
  for (const [t, w] of mods){ const cx = x + w / 2;
    if (t === 'col' || t === 'sink' || t === 'burner'){ g.add(brickBox(w, BASE_H, DEPTH, cx, BASE_H / 2, 0)); }
    else if (t === 'oven'){ const o = mkOven(w); o.position.set(cx, BASE_H + 0.06, 0); g.add(o); g.add(brickBox(w, BASE_H, DEPTH, cx, BASE_H / 2, 0)); g.add(box(w + 0.06, 0.06, DEPTH + 0.06, concreteMat(w, 0.8), cx, BASE_H + 0.03, 0)); }
    else { g.add(cavity(w, BASE_H, 0.60, cx, BASE_H / 2, 0.075)); }
    if (t === 'grill'){ const gw = w - 0.08; const gr = mkGrill(gw); gr.position.set(cx, 0.95, 0); g.add(gr); const hd = mkHood(gw); hd.position.set(cx, 1.10, 0); g.add(hd); const dr = mkDoors(w - 0.02); dr.position.set(cx, 0.40, DEPTH / 2); g.add(dr); }
    if (t === 'keg'){ const k = mkKeg(); k.position.set(cx, 0, 0); g.add(k); const tw = mkTower(); tw.position.set(cx, BASE_H + 0.06, 0); g.add(tw); }
    if (t === 'drawers'){ const d = mkDrawers(w - 0.02); d.position.set(cx, 0.40, DEPTH / 2); g.add(d); }
    if (t === 'sink'){ const s = mkSink(); s.position.set(cx, BASE_H + 0.06, 0); g.add(s); }
    if (t === 'burner'){ const b = mkBurner(); b.position.set(cx, BASE_H + 0.06, 0); g.add(b); }
    x += w; }
  g.add(brickBox(L, BASE_H, 0.15, 0, BASE_H / 2, -0.30));
  const ovenAt = mods.findIndex(m => m[0] === 'oven');
  const counterL = ovenAt >= 0 ? L - mods[ovenAt][1] : L, counterX = ovenAt >= 0 ? -mods[ovenAt][1] / 2 : 0;
  g.add(box(counterL + 0.12, 0.06, DEPTH + 0.09, concreteMat(counterL, 0.9), counterX, BASE_H + 0.03, 0));
  if (bar){ g.add(box(L + 0.12, 0.06, 0.5, concreteMat(L, 0.5), 0, BASE_H + 0.03 + 0.25, -0.55)); g.add(brickBox(L, 0.25, 0.15, 0, BASE_H + 0.125, -0.30));
    [-1, 0, 1].forEach(i => { const s = mkStool(); s.position.set(i * 0.9, 0, -0.95); g.add(s); }); }
  g.userData.L = L; return g;
}
function buildVariant(v){
  const g = new THREE.Group(); const main = buildRun(v.mods, v.bar); g.add(main);
  if (v.wing){ const w = buildRun(v.wing, false); const Lw = w.userData.L; w.rotation.y = Math.PI / 2; w.position.set(main.userData.L / 2 + 0.3, 0, DEPTH / 2 + Lw / 2 - 0.7); g.add(w); }
  const b = new THREE.Box3().setFromObject(g); const c = b.getCenter(new THREE.Vector3()); g.position.set(-c.x, 0, -c.z);
  const pivot = new THREE.Group(); pivot.add(g); pivot.userData.radius = b.getSize(new THREE.Vector3()).length() / 2; return pivot;
}

const thumb = new THREE.WebGLRenderer({ antialias: true, alpha: true });
const TW = 560, TH = 400, TDPR = Math.min(window.devicePixelRatio || 1, 2);
thumb.setPixelRatio(TDPR); thumb.setSize(TW, TH, false);
thumb.outputColorSpace = THREE.SRGBColorSpace; thumb.toneMapping = THREE.ACESFilmicToneMapping; thumb.toneMappingExposure = 1.05;
thumb.shadowMap.enabled = true; thumb.shadowMap.type = THREE.PCFSoftShadowMap;
const tScene = new THREE.Scene(); tScene.environment = new THREE.PMREMGenerator(thumb).fromScene(new RoomEnvironment(), 0.04).texture; lightScene(tScene);
const tCam = new THREE.PerspectiveCamera(26, TW / TH, 0.1, 100);
const cards = [], cardEls = [];
const modelsRoot = $('#models');
VARIANTS.forEach((v, i) => {
  const el = document.createElement('article'); el.className = 'card rv';
  el.innerHTML = (v.badge ? '<span class="badge' + (v.badge === 'new' ? ' soft' : '') + '" data-kind="' + v.badge + '"></span>' : '') +
    '<div class="view"><canvas width="' + (TW * TDPR) + '" height="' + (TH * TDPR) + '"></canvas><span class="rot"></span></div>' +
    '<div class="card-body"><div class="card-top"><h3></h3><span class="len"></span></div><p></p><ul></ul><div class="card-foot"><div class="price"></div><a class="go" href="#orcamento"></a></div></div>';
  modelsRoot.appendChild(el); cardEls.push(el);
  const ctx = el.querySelector('canvas').getContext('2d');
  const c = { el, ctx, obj: null, yaw: 0.5, target: 0.5, hover: false, dirty: true, vis: false };
  cards.push(c);
  const view = el.querySelector('.view');
  view.addEventListener('pointerenter', () => { c.hover = true; });
  view.addEventListener('pointerleave', () => { c.hover = false; });
  view.addEventListener('pointermove', e => { if (c.hover){ const r = view.getBoundingClientRect(); c.target = 0.5 + ((e.clientX - r.left) / r.width - 0.5) * 1.6; } });
  el.querySelector('.go').addEventListener('click', () => { $('#fModel').selectedIndex = i + 1; });
});
function renderCard(c){
  if (!c.obj) c.obj = buildVariant(VARIANTS[cards.indexOf(c)]);
  tScene.add(c.obj); c.obj.rotation.y = c.yaw;
  const R = c.obj.userData.radius, d = R / Math.sin(THREE.MathUtils.degToRad(tCam.fov) / 2) * 0.86, pitch = 0.32;
  tCam.position.set(0, 0.55 + d * Math.sin(pitch), d * Math.cos(pitch)); tCam.lookAt(0, 0.55, 0);
  thumb.render(tScene, tCam); tScene.remove(c.obj);
  c.ctx.clearRect(0, 0, TW * TDPR, TH * TDPR); c.ctx.drawImage(thumb.domElement, 0, 0);
  c.dirty = false;
}
const touchOnly = window.matchMedia('(hover: none)').matches;
function tickCards(dt){
  for (const c of cards){
    if (!c.vis) continue;
    if (c.hover){ c.yaw += (c.target - c.yaw) * (1 - Math.exp(-dt * 6)); c.dirty = true; }
    else if (touchOnly){ c.yaw += dt * 0.25; c.dirty = true; }
    else if (Math.abs(c.yaw - 0.5) > 0.002){ c.yaw += (0.5 - c.yaw) * (1 - Math.exp(-dt * 3)); c.dirty = true; }
    if (c.dirty) renderCard(c);
  }
}
const cardIO = new IntersectionObserver(entries => entries.forEach(en => { const c = cards[cardEls.indexOf(en.target)]; c.vis = en.isIntersecting; if (c.vis && c.dirty) renderCard(c); }), { rootMargin: '240px' });
cardEls.forEach(el => cardIO.observe(el));

/* ------------------------------------------------------------ form -> mailto */
$('#quoteForm').addEventListener('submit', e => {
  e.preventDefault(); const T = I18N[lang].form, f = e.target;
  const body = [T.name + ': ' + f.name.value, T.email + ': ' + f.email.value, T.city + ': ' + f.city.value, T.model + ': ' + (f.model.value || T.any), '', f.message.value].join('\n');
  location.href = 'mailto:hello@hearthandslab.com?subject=' + encodeURIComponent(T.subject) + '&body=' + encodeURIComponent(body);
});

/* ------------------------------------------------------------ boot */
applyLang();
window.addEventListener('scroll', readScroll, { passive: true });
readScroll(); paint(); eased = progress; lastEased = eased;
renderer.compile(scene, camera);
setProgress(0.85);
requestAnimationFrame(() => {
  frame(); setProgress(1); window.__hs_ready = true;
  setTimeout(() => boot.classList.add('done'), 250);
});
</script>
